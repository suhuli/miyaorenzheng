name: Sync official attestation data
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: attestation-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'cryptography>=44,<51'
      - name: Open data branch
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach "$RUNNER_TEMP/mirror" FETCH_HEAD
          else
            mkdir -p "$RUNNER_TEMP/mirror"
            git -C "$RUNNER_TEMP/mirror" init -b data
            git -C "$RUNNER_TEMP/mirror" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
      - name: Fetch and validate official data
        run: python tools/sync_official_data.py "$RUNNER_TEMP/mirror"
      - name: Publish snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/mirror"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json snapshots
          git commit -m "Sync official data $(date -u +%FT%TZ)"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/data
      - name: Refresh CDN manifest (best effort)
        run: curl --fail --retry 2 --max-time 30 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@data/manifest.json" || true
